<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chaud Devant">
  <!--
    Favicon : la cocotte réduite à ce qui tient dans seize pixels.

    Que des formes pleines, aucun trait : un contour de 1 unité sur 64 mesure
    un quart de pixel dans un onglet, il disparaît ou devient une bavure. La
    vapeur et les poignées sont tombées pour la même raison — à cette taille
    elles ne faisaient qu'empâter la silhouette.

    Ce qui reste est ce qui se reconnaît : un couvercle bombé posé de travers,
    un bandeau, une cuve qui s'évase. L'inclinaison est gardée, c'est elle qui
    distingue la marque d'une casserole quelconque.
  -->
  <rect width="64" height="64" rx="13" fill="#B53A24" />

  <g fill="#F7F0E1">
    <!-- Couvercle et bouton, penchés sur le bord droit. -->
    <g transform="rotate(6 57 22)">
      <path d="M7 22C10 11.5 54 11.5 57 22Z" />
      <rect x="27" y="5.5" width="10" height="6" rx="2" />
    </g>

    <!-- Le bandeau : la masse qui porte la lecture aux petites tailles. -->
    <rect x="4.5" y="27" width="55" height="7.5" rx="1.5" />

    <!-- La cuve. -->
    <path d="M9 36h46l-3.4 14c-.9 4.1-4.3 6.5-8.6 6.5H21c-4.3 0-7.7-2.4-8.6-6.5z" />
  </g>
</svg>
